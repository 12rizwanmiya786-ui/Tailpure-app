<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tailpure</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#050b18;--surf:rgba(13,23,48,.72);--ink:#eaf2ff;--mut:#8fa3c7;--blue:#2f6bff;--green:#19c37d;--line:#1d2b4d;--glass:rgba(5,11,24,.86)}
@media(prefers-color-scheme:light){:root{--bg:#f3f7fc;--surf:rgba(255,255,255,.8);--ink:#0a1b3d;--mut:#51648a;--line:#d9e3f2;--glass:rgba(243,247,252,.9)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Sora,system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 96px;position:relative}
h1,h2,h3{margin:0;line-height:1.15}h1{font-size:30px;font-weight:800;letter-spacing:-.5px}h2{font-size:21px;font-weight:800;margin-bottom:10px}h3{font-size:16px}
p{margin:0 0 10px;color:var(--mut)}section{margin:34px 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.top img{height:34px}
.rgb{position:relative;padding:2px;border-radius:22px;background:conic-gradient(from var(--a),#ff2d55,#ffb800,#19c37d,#2f6bff,#a855f7,#ff2d55);animation:spin 7s linear infinite}
.rgb>.in{background:var(--surf);border-radius:20px;overflow:hidden}
@keyframes spin{to{--a:360deg}}
.glow{box-shadow:0 0 38px rgba(47,107,255,.35),0 0 60px rgba(25,195,125,.18)}
.stage{perspective:900px;padding:26px 8px 12px;touch-action:pan-y;cursor:grab;user-select:none}
.obj{transform-style:preserve-3d;transition:transform .12s;filter:drop-shadow(0 22px 22px rgba(0,0,0,.5))}
.obj img{width:100%;display:block;border-radius:12px;pointer-events:none;background:#fff}
.seg{display:flex;gap:6px;padding:0 12px 12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px}
.chip.on{background:linear-gradient(90deg,var(--blue),var(--green));border-color:transparent;color:#fff}
.btn{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--blue),var(--green));box-shadow:0 0 18px rgba(47,107,255,.45)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.full{width:100%}.row{display:flex;gap:10px}.row>*{flex:1}
.cta{padding:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.ps{border-left:3px solid #ff4d6d}.ps.sol{border-color:var(--green)}
.pc{display:flex;gap:12px;align-items:center}.pc img{width:96px;height:64px;object-fit:cover;border-radius:10px;background:#fff}
.price b{font-size:18px}.price s{color:var(--mut);margin-left:6px;font-size:13px}
.vid{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;display:grid;place-items:center;margin-bottom:8px}
.vid video{width:100%;height:100%;object-fit:cover}
.up{display:block;text-align:center;border:1px dashed var(--mut);border-radius:12px;padding:10px;color:var(--mut);font-size:13px;margin-bottom:14px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin-bottom:10px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:10px 0 8px;position:relative}
nav button.on{color:var(--ink)}nav button.on:after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:3px;background:linear-gradient(90deg,#ff2d55,#ffb800,#19c37d,#2f6bff,#a855f7)}
nav i{display:block;font-style:normal;font-size:19px}
.badge{position:absolute;top:4px;right:28%;background:#ff2d55;color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.team{display:grid;gap:10px}.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;flex:none}
.stars button{background:none;border:0;font-size:32px;color:var(--line);padding:0 2px}.stars button.on{color:#ffb800}
.step{display:flex;gap:8px;font-size:12px;color:var(--mut);margin-top:10px}.step span{flex:1;text-align:center;border-top:3px solid var(--line);padding-top:4px}.step .d{border-color:var(--green);color:var(--ink)}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);font:inherit;text-align:left}
.q{display:flex;align-items:center;gap:10px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){.rgb{animation:none}.obj{transition:none}}

.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;animation:hue 16s linear infinite}
.bgfx i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.42;animation:drift 16s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:#ff2d55;top:-30vmax;left:-25vmax}
.bgfx i:nth-child(2){background:#19c37d;top:-20vmax;right:-35vmax;animation-delay:-4s}
.bgfx i:nth-child(3){background:#2f6bff;bottom:-30vmax;left:-30vmax;animation-delay:-8s}
.bgfx i:nth-child(4){background:#a855f7;bottom:-35vmax;right:-30vmax;animation-delay:-12s}
.bgfx i:nth-child(5){background:#ffb800;width:40vmax;height:40vmax;top:35%;left:30%;opacity:.2}
@keyframes drift{to{transform:translate(14vmax,10vmax) scale(1.18)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@media(prefers-color-scheme:light){.bgfx i{opacity:.22}}
.card,.rgb>.in{backdrop-filter:blur(14px)}
h2:before{content:"";display:inline-block;width:5px;height:.95em;vertical-align:-.12em;margin-right:9px;border-radius:3px;background:linear-gradient(#ff2d55,#ffb800,#19c37d,#2f6bff,#a855f7)}
h1{background:linear-gradient(90deg,#ff2d55,#ffb800,#19c37d,#2f6bff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:32px}
.emb{width:230px;margin:4px auto 18px;padding:3px;border-radius:32px}
.emb img{display:block;width:100%;border-radius:29px;background:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.tags span{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.price b{font-size:24px;background:linear-gradient(90deg,#19c37d,#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 28px rgba(25,195,125,.7)}}
@media(prefers-reduced-motion:reduce){.bgfx,.bgfx i,.btn{animation:none}}
</style></head><body>

function drawNav(){const t=[["home","⌂","Home"],["shop","▦","Shop"],["cart","🛒","Cart"],["orders","📦","Orders"],["more","☰","More"]];
$("#nav").innerHTML=t.map(([r,i,l])=>`<button class="${route===r?"on":""}" onclick="go('${r}')"><i>${i}</i>${l}${r==="cart"&&count()?`<b class="badge">${count()}</b>`:""}</button>`).join("")}
const head=()=>`<div class="top"><img src="${IMG.logo}" alt="Tailpure"><button class="chip" onclick="go('${S.user?"more":"login"}')">${S.user?S.user.name:"Login"}</button></div>`;
function viewer(src,id,btn=true){return `<div class="rgb glow"><div class="in">
<div class="stage" id="stg"><div class="obj" id="obj"><img src="${src}" alt="Tailpure exhaust filter 3D view"></div></div>
<div class="seg"><button class="chip ${view==="a"?"on":""}" onclick="view='a';draw()">Assembled</button><button class="chip ${view==="x"?"on":""}" onclick="view='x';draw()">Exploded view</button><span style="margin-left:auto;font-size:12px;color:var(--mut);align-self:center">Drag to rotate</span></div></div></div>
${btn?`<div class="row" style="margin-top:12px"><button class="btn ghost" onclick="add(${id})">Add to cart</button><button class="btn" onclick="add(${id},1)">Buy now</button></div>`:""}`}
function buy(p){return `<div class="rgb glow"><div class="in"><img src="${IMG.a}" alt="${p.name}" style="width:100%;display:block;background:#fff"><div style="padding:16px"><h3>${p.name}</h3><div class="price" style="margin:6px 0 10px"><b>${fmt(p.price)}</b></div><div class="tags"><span>Clamp-on fit</span><span>COD available</span><span>Secure payment</span></div><div class="row"><button class="btn ghost" onclick="add(${p.id})">Add to cart</button><button class="btn" onclick="add(${p.id},1)">Buy now</button></div></div></div></div>`}
function bind3d(){const s=$("#stg"),o=$("#obj");if(!s)return;let ry=-14,rx=6,d=null,t=0;const ap=()=>o.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;ap();
s.onpointerdown=e=>{d=[e.clientX,e.clientY,ry,rx];s.setPointerCapture(e.pointerId)};
s.onpointermove=e=>{if(!d)return;ry=Math.max(-40,Math.min(40,d[2]+(e.clientX-d[0])*.4));rx=Math.max(-22,Math.min(22,d[3]-(e.clientY-d[1])*.3));ap()};
s.onpointerup=()=>{d=null};
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)clearInterval(bind3d.i),bind3d.i=setInterval(()=>{if(!d&&document.body.contains(o)){t+=.04;ry=-14+Math.sin(t)*14;ap()}},60)}
function vids(){return [1,2].map(n=>`<h3 style="margin:8px 0">Video ${n}</h3><div class="vid">${S.vids[n]?`<video src="${S.vids[n]}" controls playsinline></video>`:`<span style="color:#8fa3c7;font-size:13px">16:9 video slot</span>`}</div>
<label class="up">Upload video ${n}<input type="file" accept="video/*" hidden onchange="upV(${n},this)"></label>`).join("")}
function upV(n,i){const f=i.files[0];if(!f)return;S.vids[n]=URL.createObjectURL(f);draw()}
function company(){return `<section><h2>About Tailpure</h2><div class="card"><p>Tailpure builds an exhaust filtration unit that fits on the exhaust of bikes and scooties and turns polluted exhaust into cleaner air. We started in Delhi, where traffic smoke is part of every breath.</p><p style="margin:0">Mission: make every two-wheeler part of the solution.</p></div></section>
<section><h2>Executive leadership</h2><div class="team">${TEAM.map(t=>`<div class="card pc" style="margin:0"><div class="av">${t[0][0]}</div><div><h3>${t[0]}</h3><div style="font-size:13px;color:var(--green)">${t[1]}</div><p style="font-size:13px;margin:4px 0 0">${t[2]}</p></div></div>`).join("")}</div></section>`}
const V={
home(){return head()+`<div style="text-align:center"><div class="emb rgb glow"><img src="${IMG.emb}" alt="Tailpure emblem"></div><h1>Clean air from every tailpipe.</h1><p style="margin-top:8px">Fit Tailpure on your bike or scooty exhaust and breathe easier in Delhi.</p></div><section style="margin-top:26px"><h2>See it in 3D</h2>`+viewer(IMG[view],1,false)+`</section><section><h2>Buy Tailpure</h2>`+buy(P[0])+`</section>`+
`<section><h2>The problem</h2><div class="card ps"><h3>Delhi’s air is choking</h3><p style="margin:6px 0 0">Millions of bikes and scooties release unfiltered exhaust smoke every day. It adds fine particles and harmful gases to the air people breathe on the road and at home.</p></div>
<h2 style="margin-top:20px">Our solution</h2><div class="card ps sol"><h3>Filter at the source</h3><p style="margin:6px 0 0">Tailpure clamps onto the exhaust and passes smoke through a carbon layer and ceramic beads inside a steel housing, so cleaner air comes out of the tailpipe.</p></div></section>
<section><h2>Inside the filter</h2><div class="rgb"><div class="in"><img src="${IMG.x}" alt="Exploded view" style="width:100%;display:block"></div></div>
<p style="margin-top:10px">Blue silicone couplers with steel clamps, a steel housing, a carbon mesh layer and a ceramic bead layer.</p></section>
<section><h2>Watch Tailpure</h2>${vids()}</section>`+company()},
shop(){let l=P.filter(p=>(cat==="All"||p.cat.includes(cat))&&p.name.toLowerCase().includes(q.toLowerCase()));
if(sort==="lo")l.sort((a,b)=>a.price-b.price);if(sort==="hi")l.sort((a,b)=>b.price-a.price);
return head()+`<h2>Product catalogue</h2><input id="sq" placeholder="Search filters" value="${q}" oninput="q=this.value;list()">
<div class="row" style="margin-bottom:12px;gap:6px">${["All","Bike","Scooty"].map(c=>`<button class="chip ${cat===c?"on":""}" onclick="cat='${c}';draw()">${c}</button>`).join("")}</div>
<select onchange="sort=this.value;draw()"><option value="pop">Sort: Popular</option><option value="lo" ${sort==="lo"?"selected":""}>Price: low to high</option><option value="hi" ${sort==="hi"?"selected":""}>Price: high to low</option></select><div id="pl">${plist(l)}</div>`},
product(){const p=P.find(x=>x.id===arg);return head()+`<button class="chip" onclick="go('shop')">‹ Back</button><h2 style="margin-top:12px">${p.name}</h2>`+viewer(IMG[view],p.id)+
`<div class="price" style="margin:14px 0"><b>${fmt(p.price)}</b></div><p>${p.d}</p><div class="card"><h3>What’s included</h3><p style="margin:6px 0 0">Filter unit • 2 steel clamps • 2 silicone couplers • install guide</p></div>
<h2>Reviews</h2>${rev()}`},
cart(){const it=Object.keys(S.cart).map(Number).map(i=>[P.find(p=>p.id===i),S.cart[i]]);const tot=it.reduce((a,[p,n])=>a+p.price*n,0);
if(!it.length)return head()+`<h2>Your cart is empty</h2><p>Add a Tailpure filter to get started.</p><button class="btn" onclick="go('shop')">Browse products</button>`;
return head()+`<h2>Cart</h2>`+it.map(([p,n])=>`<div class="card pc"><img src="${IMG.a}" alt=""><div style="flex:1"><h3>${p.name}</h3><div class="price"><b>${fmt(p.price)}</b></div><div class="q"><button onclick="qty(${p.id},-1)">−</button>${n}<button onclick="qty(${p.id},1)">+</button></div></div></div>`).join("")+
`<div class="card"><div class="row" style="justify-content:space-between"><span>Total</span><b style="text-align:right">${fmt(tot)}</b></div></div>
<h2>Delivery details</h2><input id="nm" placeholder="Full name" value="${S.user?S.user.name:""}"><input id="ph" placeholder="Phone number" inputmode="tel"><textarea id="ad" rows="2" placeholder="Address"></textarea><input id="pn" placeholder="Pincode" inputmode="numeric">
<h2>Payment</h2><div class="row" style="margin-bottom:14px"><button class="chip ${pay==="online"?"on":""}" onclick="pay='online';draw()">Online (Razorpay)</button><button class="chip ${pay==="cod"?"on":""}" onclick="pay='cod';draw()">Cash on delivery</button></div>
<button class="btn full" onclick="checkout(${tot})">${pay==="cod"?"Place order":"Pay "+fmt(tot)}</button>`},
orders(){return head()+`<h2>My orders</h2>`+(S.orders.length?S.orders.map(o=>`<div class="card"><div class="row" style="justify-content:space-between"><b>#${o.id}</b><span style="text-align:right;color:var(--green)">${fmt(o.tot)}</span></div><p style="margin:4px 0 0;font-size:13px">${o.items} • ${o.pay} • ${o.date}</p>
<div class="step">${["Placed","Packed","Shipped","Delivered"].map((s,i)=>`<span class="${i<=o.st?"d":""}">${s}</span>`).join("")}</div></div>`).join(""):`<p>No orders yet. Your orders and tracking will show here.</p>`)},
more(){return head()+`<h2>More</h2>`+[["company","Company profile & team"],["feedback","Rate & feedback"],["support","Customer support"],["privacy","Privacy policy"],["returns","Return policy"],[S.user?"out":"login",S.user?"Log out ("+S.user.name+")":"Secure login"]].map(([r,l])=>`<button class="li" onclick="${r==="out"?"S.user=null;save();draw()":`go('${r}')`}">${l}<span>›</span></button>`).join("")},
company(){return head()+company()},
feedback(){return head()+`<h2>Rate Tailpure</h2><div class="card"><div class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=rate?"on":""}" onclick="rate=${i};draw()" aria-label="${i} stars">★</button>`).join("")}</div><textarea id="fb" rows="3" placeholder="How was the Tailpure filter for you?"></textarea><button class="btn full" onclick="sendFb()">Submit feedback</button></div><h2>What customers say</h2>${rev()}`},
support(){return head()+`<h2>Customer support</h2><div class="card"><p>Questions about fitting, orders or returns? Send us a message.</p><input placeholder="Your email or phone"><textarea rows="3" placeholder="How can we help?"></textarea><button class="btn full" onclick="toast('Message sent. We will reply soon.')">Send message</button></div><p>Email: support@tailpure.in (replace with your address)</p>`},
privacy(){return head()+`<h2>Privacy policy</h2><div class="card"><p>We collect your name, phone, address and order details only to process and deliver your orders and to give support.</p><p>Payments are handled by Razorpay. We never see or store your card details.</p><p style="margin:0">We do not sell your data. You can ask us to delete your account any time.</p></div>`},
returns(){return head()+`<h2>Return policy</h2><div class="card"><p>Return an unused, undamaged product within 7 days of delivery for a refund or replacement.</p><p>Refunds for online payments go back to the original payment method.</p><p style="margin:0">Contact support with your order number to start a return. (Edit these terms to match your final policy.)</p></div>`},
login(){return head()+`<h2>Secure login</h2><div class="card"><input id="le" placeholder="Name"><input id="lm" placeholder="Email or phone"><input id="lp" type="password" placeholder="Password"><button class="btn full" onclick="login()">Log in</button><p style="margin:10px 0 0;font-size:12px">Demo login. With Firebase configured, this uses Firebase Authentication.</p></div>`}};
function plist(l){return l.length?l.map(p=>`<div class="card pc" onclick="go('product',${p.id})"><img src="${IMG.a}" alt=""><div style="flex:1"><h3>${p.name}</h3><p style="font-size:12px;margin:2px 0">${p.cat}</p><div class="price"><b>${fmt(p.price)}</b></div></div></div>`).join(""):`<p>No products match. Clear the search or pick another filter.</p>`}
function list(){const l=P.filter(p=>(cat==="All"||p.cat.includes(cat))&&p.name.toLowerCase().includes(q.toLowerCase()));$("#pl").innerHTML=plist(l)}
function rev(){return S.reviews.length?S.reviews.map(r=>`<div class="card"><div style="color:#ffb800">${"★".repeat(r.s)}${"☆".repeat(5-r.s)}</div><p style="margin:4px 0 0">${r.t.replace(/</g,"&lt;")}</p></div>`).join(""):`<p>No reviews yet. Be the first to rate this product.</p>`}
function sendFb(){const t=$("#fb").value.trim();if(!rate)return toast("Pick a star rating");S.reviews.unshift({s:rate,t:t||"Rated "+rate+" stars"});rate=0;save();toast("Thanks for your feedback");draw()}
function qty(id,d){S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];save();draw()}
function login(){const n=$("#le").value.trim(),m=$("#lm").value.trim();if(!n||!m||!$("#lp").value)return toast("Fill name, email/phone and password");S.user={name:n,id:m};save();go("more")}
function done(tot,mode){const id=Date.now().toString().slice(-6),items=count()+" item(s)";S.orders.unshift({id,tot,items,pay:mode,date:new Date().toLocaleDateString("en-IN"),st:0});S.cart={};save();toast("Order placed");go("orders")}
function checkout(tot){if(["nm","ph","ad","pn"].some(i=>!$("#"+i).value.trim()))return toast("Fill all delivery details");
if(pay==="cod")return done(tot,"Cash on delivery");
if(window.Razorpay){try{new Razorpay({key:RAZORPAY_KEY,amount:tot*100,currency:"INR",name:"Tailpure",handler:()=>done(tot,"Paid online")}).open();return}catch(e){}}
done(tot,"Paid online (demo)")}
function draw(){$("#app").innerHTML=V[route]();drawNav();bind3d()}
draw();
</script></body></html>
